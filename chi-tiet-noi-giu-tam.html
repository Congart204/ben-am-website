<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chi tiết nơi giữ tạm</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Nunito+Sans:wght@700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=3">
<body data-page="foster">
  <div id="site-header"></div>
  <section class="section">
    <div class="container">
      <div class="breadcrumb"><a href="index.html">Trang chủ</a> / <a href="noi-giu-tam.html">Nơi giữ tạm</a> / Chi tiết</div>
      <div id="content"></div>
    </div>
  </section>
  <div id="site-footer"></div>
  <script src="js/data.js?v=2"></script>
  <script src="js/main.js?v=2"></script>
  <script>
    const f = FOSTERS.find(x => x.id === qs("id")) || FOSTERS[0];
    document.getElementById("content").innerHTML = `
      <div class="detail-grid">
        <div class="detail-gallery"><img src="${f.img}" alt="${f.name}"></div>
        <div>
          <span class="badge ${f.status==='available'?'badge-ready':'badge-outline'} mb-16" style="display:inline-flex;">${f.status==='available'?'Còn nhận':'Đã đầy'}</span>
          <h1 style="font-size:28px;">${f.name}</h1>
          <table class="info-table mb-24">
            <tr><td>Khu vực</td><td>${f.area}</td></tr>
            <tr><td>Loại thú có thể nhận</td><td>${f.accepts.join(", ")}</td></tr>
            <tr><td>Sức chứa hiện tại</td><td>${f.capacity}</td></tr>
            <tr><td>Thời gian giữ tạm</td><td>${f.duration}</td></tr>
            <tr><td>Chi phí</td><td>${f.cost}</td></tr>
            <tr><td>Cập nhật</td><td>${f.updated}</td></tr>
          </table>
          <div class="panel mb-24">
            <h3 style="font-size:16px;">Điều kiện tiếp nhận</h3>
            <p class="muted mb-0">${f.condition}</p>
          </div>
          ${f.status === 'available'
            ? `<a href="form-cuu-ho.html" class="btn btn-primary btn-block">Gửi yêu cầu hỗ trợ đến nơi này</a>`
            : `<button class="btn btn-outline btn-block" disabled>Hiện đã đầy chỗ</button>`}
        </div>
      </div>`;
  </script>
</body>
